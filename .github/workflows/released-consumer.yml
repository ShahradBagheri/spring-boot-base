name: Verify the released web starter

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base-version:
        description: Released Base version already available in Maven Central
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and start the standalone consumer
        env:
          BASE_VERSION: ${{ inputs.base-version || github.event.release.tag_name }}
        run: |
          version="${BASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ || "$version" == *-SNAPSHOT ]]; then
            echo "Use a released Base version."
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress -f verification/web-consumer/pom.xml \
            "-Dmaven.repo.local=${RUNNER_TEMP}/released-consumer-cache" \
            "-Dbase.version=$version" clean verify

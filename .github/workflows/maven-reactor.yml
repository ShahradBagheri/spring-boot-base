name: Maven reactor verification

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: base_project
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d base_project"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify module dependency graph
        run: python3 scripts/verify_reactor.py
      - name: Verify Docker is available
        run: docker info
      - name: Build, test, and stage Maven artifacts
        run: |
          mvn --batch-mode --no-transfer-progress clean deploy \
            "-DaltDeploymentRepository=publication-test::file://${RUNNER_TEMP}/base-maven-staging"
      - name: Resolve staged libraries from a standalone Spring Boot POM
        run: python3 scripts/verify_bom_consumer.py --repository "${RUNNER_TEMP}/base-maven-staging"
      - name: Build and start the standalone consumer against staged artifacts
        run: |
          read -r base_group base_version <<< "$(python3 -c 'import xml.etree.ElementTree as E; p = E.parse("spring-boot-base-bom/pom.xml"); ns = {"m": "http://maven.apache.org/POM/4.0.0"}; print(p.findtext("m:groupId", namespaces=ns), p.findtext("m:version", namespaces=ns))')"
          mvn --batch-mode --no-transfer-progress -f verification/web-consumer/pom.xml \
            "-Dmaven.repo.local=${RUNNER_TEMP}/staged-consumer-cache" \
            "-Dbase.group=$base_group" "-Dbase.version=$base_version" \
            "-Dbase.repository=file://${RUNNER_TEMP}/base-maven-staging" clean verify
      - name: Show failing test reports
        if: failure()
        run: |
          find . -type f \( -path '*/target/surefire-reports/*.txt' -o -path '*/target/failsafe-reports/*.txt' \) -print -exec cat {} \;
      - name: Upload failing test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
      - name: Verify executable demo artifact
        run: python3 scripts/verify_reactor.py
      - name: Inspect module dependency trees
        run: mvn --batch-mode --no-transfer-progress dependency:tree
      - name: Smoke test executable demo application
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://localhost:5432/base_project
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SERVER_PORT: '8080'
        run: |
          java -jar demo-app/target/demo-app-0.0.1-SNAPSHOT.jar > demo-app-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat demo-app-startup.log
              exit 1
            fi
            sleep 2
          done
          cat demo-app-startup.log
          exit 1

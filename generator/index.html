<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Boot Base project generator</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #132b24; background: #edf4ee; }
    body { margin: 0; }
    main { max-width: 70rem; margin: auto; padding: 3rem 1.25rem; }
    h1 { margin: 0 0 1.6rem; font-size: clamp(2rem, 5vw, 3.6rem); letter-spacing: -.045em; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
    fieldset { min-width: 0; margin: 0; border: 1px solid #b9cfbe; border-radius: 1rem; background: #fff; padding: 1rem 1.25rem 1.3rem; }
    legend { font-weight: 700; padding: 0 .4rem; }
    label { display: block; margin: .6rem 0; font-weight: 550; }
    input:not([type=checkbox]), select { display: block; box-sizing: border-box; width: 100%; padding: .55rem; margin-top: .25rem; color: inherit; font: inherit; border: 1px solid #9db4a5; border-radius: .35rem; background: #f8fbf8; }
    .features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .1rem .5rem; }
    .features label { display: flex; align-items: baseline; gap: .45rem; }
    .foot { grid-column: 1 / -1; }
    button { background: #145438; color: white; font: inherit; font-weight: 700; padding: .7rem 1.15rem; border: 0; border-radius: .45rem; cursor: pointer; }
    button:disabled { cursor: default; opacity: .65; }
    :focus-visible { outline: 3px solid #a04b17; outline-offset: 2px; }
    #requirements, #version, #status { min-height: 1.2rem; }
    @media (max-width: 44rem) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Spring Boot Base</h1>
  <p id="version"></p>
  <form id="project">
    <fieldset>
      <legend>Project</legend>
      <label>Name <input name="name" value="My application" maxlength="80" required></label>
      <label>Group ID <input name="group" value="com.example" maxlength="120" required></label>
      <label>Artifact ID <input name="artifact" value="my-application" maxlength="64" required></label>
      <label>Package <input name="package" value="com.example.app" maxlength="120" required></label>
      <label>Java <select name="java" required></select></label>
      <label>Spring Boot <select name="boot" required></select></label>
      <label>Database <select name="database"><option value="none">None</option><option value="postgresql">PostgreSQL</option></select></label>
    </fieldset>
    <fieldset>
      <legend>Features</legend>
      <label>Preset <select id="preset"><option value="">Custom selection</option></select></label>
      <div class="features" id="features"></div>
      <p id="requirements" aria-live="polite"></p>
    </fieldset>
    <div class="foot">
      <button type="submit" disabled>Download project ZIP</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </form>
</main>
<script>
const form = document.querySelector("#project");
const features = document.querySelector("#features");
const preset = document.querySelector("#preset");
const requirements = document.querySelector("#requirements");
const status = document.querySelector("#status");
const download = form.querySelector("button");
let catalog;

function selected() {
  return [...features.querySelectorAll("input:checked")].map(input => input.value);
}

function refresh() {
  const picks = selected();
  const resolved = new Set(picks);
  const pending = [...picks];
  while (pending.length) {
    for (const feature of catalog.features[pending.pop()].requires ?? []) {
      if (!resolved.has(feature)) {
        resolved.add(feature);
        pending.push(feature);
      }
    }
  }
  const implied = [...resolved].filter(key => !picks.includes(key)).map(key => catalog.features[key].label);
  const needsDatabase = resolved.has("jpa");
  const incompatible = needsDatabase !== (form.elements.database.value === "postgresql");
  const messages = [];
  if (implied.length) messages.push("Also includes " + implied.join(", ") + ".");
  if (incompatible) messages.push(needsDatabase ? "Select PostgreSQL for JPA." : "Choose no database or add JPA.");
  requirements.textContent = messages.join(" ");
  download.disabled = incompatible;
}

async function initialize() {
  const response = await fetch("/catalog");
  if (!response.ok) throw new Error("The feature catalog could not be loaded.");
  catalog = await response.json();
  document.querySelector("#version").textContent = "Generate a Maven project using Base " + catalog.baseVersion + ".";
  form.elements.java.add(new Option(catalog.java));
  form.elements.boot.add(new Option(catalog.springBoot));
  for (const [id, feature] of Object.entries(catalog.features)) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = id;
    label.title = feature.description;
    const suffix = feature.kind === "library" ? " (library)" : "";
    label.append(input, document.createTextNode(feature.label + suffix));
    features.append(label);
  }
  for (const name of Object.keys(catalog.presets)) preset.add(new Option(name));
  features.addEventListener("change", () => { preset.value = ""; refresh(); });
  preset.addEventListener("change", () => {
    const picks = catalog.presets[preset.value] ?? [];
    for (const input of features.querySelectorAll("input")) input.checked = picks.includes(input.value);
    refresh();
  });
  form.elements.database.addEventListener("change", refresh);
  refresh();
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  download.disabled = true;
  status.textContent = "";
  try {
    const body = Object.fromEntries(new FormData(form));
    body.features = selected();
    const response = await fetch("/project", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    if (!response.ok) throw new Error((await response.json()).error);
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement("a");
    link.href = url;
    link.download = body.artifact + ".zip";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = "Project ZIP ready.";
  } catch (error) {
    status.textContent = error.message;
  } finally {
    refresh();
  }
});
initialize().catch(error => { status.textContent = error.message; });
</script>
</body>
</html>
